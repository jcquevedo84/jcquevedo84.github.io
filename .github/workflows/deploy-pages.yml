name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - feature/professional-portfolio

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'jcquevedo84/jcquevedo84.github.io' && github.ref == 'refs/heads/feature/professional-portfolio'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check toolchain and tracked private paths
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v$(node -p 'require("./package.json").engines.node')"
          test "$(npm --version)" = "$(node -p 'require("./package.json").engines.npm')"
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";

          const files = execFileSync("git", ["ls-files", "-z"], { encoding: "utf8" }).split("\0");
          const privatePath = /(?:^|\/)(?:\.env(?:[./]|$)|resource(?:\/|$))/i;
          if (files.some((file) => file !== ".env.example" && privatePath.test(file))) {
            console.error("Tracked environment or private resource files are forbidden.");
            process.exitCode = 1;
          }
          NODE

      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          git diff --exit-code -- package.json package-lock.json

      - name: Build and verify the public export
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_DIGITAL_TWIN_ENABLED: "false"
        run: npm run verify

      - name: Upload verified static export
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
